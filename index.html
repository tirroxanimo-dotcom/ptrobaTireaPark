<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TireaPark · BLE · PROBA-1</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TireaPark BLE">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:  #00e64d;
  --red:    #ff3c3c;
  --yellow: #facc15;
  --blue:   #38bdf8;
  --purple: #a855f7;
  --bg:     #080b10;
  --card:   #0e1318;
  --border: #1c2330;
  --text:   #c9d1d9;
  --dim:    #3d4a5a;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'Space Mono', monospace;
  color: var(--text);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  min-height: 100dvh;
  background-image:
    linear-gradient(rgba(168,85,247,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168,85,247,0.03) 1px, transparent 1px);
  background-size: 32px 32px;
}

.card {
  width: 100%;
  max-width: 360px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px 20px 20px;
  box-shadow: 0 0 60px rgba(168,85,247,0.06), 0 20px 40px rgba(0,0,0,0.6);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--purple), transparent);
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.logo { display: flex; align-items: center; gap: 10px; }

.logo-icon {
  width: 36px; height: 36px;
  background: #0a0a1a;
  border: 1px solid var(--purple);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.logo-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: #fff;
  line-height: 1;
}

.logo-sub { font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-top: 1px; }

.ble-dot-wrap {
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; color: var(--dim); letter-spacing: 0.5px;
}

.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim);
  box-shadow: 0 0 6px currentColor;
  transition: background 0.3s;
}
.dot.connected    { background: var(--green);  box-shadow: 0 0 8px var(--green); }
.dot.disconnected { background: var(--red);    box-shadow: 0 0 8px var(--red); }
.dot.scanning     { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); animation: pulse 1s infinite; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.btn-ble {
  background: linear-gradient(135deg, #1a0a2e, #2d1060);
  color: var(--purple);
  border: 1px solid rgba(168,85,247,0.4);
  border-radius: 10px;
  padding: 8px 14px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.2s;
}
.btn-ble:active { opacity: 0.7; }
.btn-ble:disabled { opacity: 0.3; cursor: not-allowed; }

.status-box {
  background: #060a0e;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 16px 14px;
  text-align: center;
  margin-bottom: 16px;
  transition: border-color 0.3s;
}

.status-box.RIDICAT       { border-color: rgba(0,230,77,0.4); }
.status-box.COBORAT       { border-color: rgba(255,60,60,0.4); }
.status-box.SE_RIDICA,
.status-box.SE_COBOARA    { border-color: rgba(250,204,21,0.4); }
.status-box.BLOCAT_MASINA { border-color: rgba(56,189,248,0.4); }
.status-box.OFFLINE       { border-color: rgba(168,85,247,0.2); }

.status-label {
  font-size: 9px; letter-spacing: 2px;
  color: var(--dim); margin-bottom: 10px; text-transform: uppercase;
}

.status-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px; letter-spacing: 3px; line-height: 1;
  color: var(--dim); transition: color 0.25s, text-shadow 0.25s;
}

.status-val.RIDICAT       { color: var(--green);  text-shadow: 0 0 20px rgba(0,230,77,0.5); }
.status-val.COBORAT       { color: var(--red);    text-shadow: 0 0 20px rgba(255,60,60,0.5); }
.status-val.SE_RIDICA,
.status-val.SE_COBOARA    { color: var(--yellow); text-shadow: 0 0 20px rgba(250,204,21,0.5); }
.status-val.BLOCAT_MASINA { color: var(--blue);   text-shadow: 0 0 20px rgba(56,189,248,0.5); }
.status-val.OFFLINE       { color: var(--purple); text-shadow: 0 0 20px rgba(168,85,247,0.3); }

.masina-row { margin-top: 8px; font-size: 10px; color: var(--dim); letter-spacing: 1px; }
.masina-row .da { color: var(--blue); font-weight: bold; }

.progress-wrap {
  height: 3px; background: var(--border);
  border-radius: 2px; margin-top: 12px; overflow: hidden; display: none;
}
.progress-bar {
  height: 100%; width: 0%;
  background: var(--yellow); border-radius: 2px;
  box-shadow: 0 0 8px var(--yellow);
}
.timer-txt {
  font-size: 10px; color: var(--yellow);
  margin-top: 6px; min-height: 14px; letter-spacing: 0.5px;
}

.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

.btn {
  border: none; border-radius: 12px; padding: 18px 10px;
  font-family: 'Bebas Neue', sans-serif; font-size: 18px;
  letter-spacing: 2px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; position: relative; overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  transition: transform 0.1s;
}
.btn .btn-icon { font-size: 22px; }
.btn .btn-lbl  { font-size: 14px; letter-spacing: 1px; }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:disabled {
  background: #0e1318 !important;
  color: #1e2a35 !important;
  border-color: #1c2330 !important;
  box-shadow: none !important;
  cursor: not-allowed;
  pointer-events: none;
}

.btn-up {
  background: linear-gradient(135deg, #003d1a, #005c28);
  color: var(--green); border: 1px solid rgba(0,230,77,0.3);
  box-shadow: 0 4px 20px rgba(0,230,77,0.15);
}
.btn-down {
  background: linear-gradient(135deg, #3d0000, #5c0000);
  color: var(--red); border: 1px solid rgba(255,60,60,0.3);
  box-shadow: 0 4px 20px rgba(255,60,60,0.15);
}

.log-header { font-size: 9px; color: var(--dim); letter-spacing: 2px; margin-bottom: 6px; text-transform: uppercase; }

.log {
  background: #060a0e; border: 1px solid var(--border);
  border-radius: 10px; padding: 10px; height: 110px;
  overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.log::-webkit-scrollbar { width: 3px; }
.log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.log-line { font-size: 9px; padding: 2px 0; border-bottom: 1px solid #0e1318; color: var(--dim); }
.log-line.ok   { color: var(--green); }
.log-line.err  { color: var(--red); }
.log-line.info { color: var(--purple); }
.log-line.warn { color: var(--yellow); }

.no-ble {
  display: none;
  background: rgba(168,85,247,0.1);
  border: 1px solid rgba(168,85,247,0.3);
  border-radius: 10px;
  padding: 12px;
  text-align: center;
  font-size: 10px;
  color: var(--purple);
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🅿</div>
      <div>
        <div class="logo-text">TireaPark</div>
        <div class="logo-sub">BLE · PROBA-1</div>
      </div>
    </div>
    <div class="ble-dot-wrap">
      <div class="dot" id="ble-dot"></div>
      <span id="ble-txt">—</span>
      <button class="btn-ble" id="btn-ble" onclick="conecteazaBLE()">CONECTEAZĂ</button>
    </div>
  </div>

  <div class="no-ble" id="no-ble">
    ⚠️ Browserul tău nu suportă Web Bluetooth.<br>
    Folosește Chrome pe Android.
  </div>

  <div class="status-box OFFLINE" id="status-box">
    <div class="status-label">STATUS BLOCATOR</div>
    <div class="status-val OFFLINE" id="status-val">OFFLINE</div>
    <div class="masina-row" id="masina-row" style="display:none">
      🚗 Mașină detectată: <span class="da">DA</span>
    </div>
    <div class="progress-wrap" id="prog-wrap">
      <div class="progress-bar" id="prog-bar"></div>
    </div>
    <div class="timer-txt" id="timer-txt"></div>
  </div>

  <div class="buttons">
    <button class="btn btn-up"   id="btn-up"   disabled>
      <span class="btn-icon">▲</span>
      <span class="btn-lbl">RIDICĂ</span>
    </button>
    <button class="btn btn-down" id="btn-down" disabled>
      <span class="btn-icon">▼</span>
      <span class="btn-lbl">COBOARĂ</span>
    </button>
  </div>

  <div class="log-header">▸ LOG EVENIMENTE</div>
  <div class="log" id="log">
    <div class="log-line info">── sistem pornit ──</div>
  </div>
</div>

<link rel="icon" id="favicon" href="#">
<link rel="apple-touch-icon" id="apple-icon" href="#">

<script>
// ── PWA ICON mov cu text PROBA ──
(function() {
  var c = document.createElement('canvas');
  c.width = c.height = 192;
  var ctx = c.getContext('2d');

  // Fundal negru cu colturi rotunde
  ctx.fillStyle = '#0d1117';
  ctx.beginPath();
  ctx.roundRect(0, 0, 192, 192, 38);
  ctx.fill();

  // Bara verticala (simbolul blocatorului) - mov
  ctx.fillStyle = '#a855f7';
  ctx.beginPath();
  ctx.roundRect(80, 18, 32, 72, 16);
  ctx.fill();

  // Bara orizontala (baza blocatorului) - mov
  ctx.fillStyle = '#a855f7';
  ctx.beginPath();
  ctx.roundRect(52, 100, 88, 26, 12);
  ctx.fill();

  // Text PROBA - mov
  ctx.fillStyle = '#a855f7';
  ctx.font = 'bold 36px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('PROBA', 96, 168);

  var iconData = c.toDataURL('image/png');

  document.getElementById('favicon').href = iconData;
  document.getElementById('apple-icon').href = iconData;

  // Manifest PWA
  var m = {
    name: "TireaPark BLE",
    short_name: "PROBA",
    start_url: ".",
    display: "standalone",
    background_color: "#0d1117",
    theme_color: "#0d1117",
    orientation: "portrait",
    icons: [
      { src: iconData, sizes: "192x192", type: "image/png" },
      { src: iconData, sizes: "512x512", type: "image/png" }
    ]
  };
  var l = document.createElement('link');
  l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type: 'application/json'}));
  document.head.appendChild(l);
})();

if ('serviceWorker' in navigator) {
  var sw = `self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{self.clients.claim()});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type: 'application/javascript'})), {scope: '/'});
}
</script>
<script>
// ── UUIDs (trebuie sa fie identice cu ESP32) ──
var SERVICE_UUID  = '12345678-1234-1234-1234-123456789abc';
var STATUS_UUID   = '12345678-1234-1234-1234-123456789ab1';
var COMANDA_UUID  = '12345678-1234-1234-1234-123456789ab2';

// ── STARE ──
var pozitie      = 'COBORAT';
var masina       = 'NU';
var cmdPending   = false;
var bleDevice    = null;
var bleServer    = null;
var charStatus   = null;
var charComanda  = null;
var progTimer    = null;

// ── DOM ──
var elBox    = document.getElementById('status-box');
var elVal    = document.getElementById('status-val');
var elMRow   = document.getElementById('masina-row');
var elPWrap  = document.getElementById('prog-wrap');
var elPBar   = document.getElementById('prog-bar');
var elTimer  = document.getElementById('timer-txt');
var btnUp    = document.getElementById('btn-up');
var btnDown  = document.getElementById('btn-down');
var btnBLE   = document.getElementById('btn-ble');
var elDot    = document.getElementById('ble-dot');
var elTxt    = document.getElementById('ble-txt');

// ── Verifica suport Web Bluetooth ──
if (!navigator.bluetooth) {
  document.getElementById('no-ble').style.display = 'block';
  btnBLE.disabled = true;
  addLog('Web Bluetooth nu e suportat!', 'err');
}

// ── LOG ──
function addLog(msg, tip) {
  var el = document.getElementById('log');
  var d  = document.createElement('div');
  d.className = 'log-line ' + (tip || '');
  var t = new Date();
  d.textContent = '[' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds()) + '] ' + msg;
  el.insertBefore(d, el.children[1] || null);
}
function pad(n) { return String(n).padStart(2, '0'); }

// ── AFISEAZA STARE ──
function afiseaza(stare) {
  var label = stare.replace(/_/g, ' ');
  if (stare === 'BLOCAT_MASINA') label = 'MASINA';
  elVal.textContent = label;
  elVal.className   = 'status-val ' + stare;
  elBox.className   = 'status-box ' + stare;
}

// ── UPDATE UI ──
function updateUI() {
  if (cmdPending || !charComanda) {
    btnUp.disabled = btnDown.disabled = true;
    return;
  }
  if (masina === 'DA') {
    btnUp.disabled = btnDown.disabled = true;
    elMRow.style.display = 'block';
    afiseaza('BLOCAT_MASINA');
    return;
  }
  elMRow.style.display = 'none';
  if (pozitie === 'RIDICAT') {
    btnUp.disabled   = true;
    btnDown.disabled = false;
    afiseaza('RIDICAT');
  } else {
    btnUp.disabled   = false;
    btnDown.disabled = true;
    afiseaza('COBORAT');
  }
}

// ── PROGRES ──
function startProgres(durata) {
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
  var elapsed = 0;
  elPWrap.style.display = 'block';
  elPBar.style.width = '0%';
  progTimer = setInterval(function() {
    elapsed += 50;
    elPBar.style.width = Math.min((elapsed / durata) * 100, 100) + '%';
    var ramas = ((durata - elapsed) / 1000).toFixed(1);
    elTimer.textContent = ramas > 0 ? 'Finalizare în ' + ramas + 's...' : '';
    if (elapsed >= durata) {
      clearInterval(progTimer); progTimer = null;
      elPWrap.style.display = 'none';
      elPBar.style.width = '0%';
      elTimer.textContent = '';
    }
  }, 50);
}

// ── CONECTARE BLE ──
async function conecteazaBLE() {
  if (!navigator.bluetooth) return;
  try {
    addLog('Caut TireaPark-PROBA1...', 'info');
    elDot.className = 'dot scanning';
    elTxt.textContent = 'scanare...';
    btnBLE.disabled = true;

    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'TireaPark-PROBA1' }],
      optionalServices: [SERVICE_UUID]
    });

    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

    addLog('Conectez la ' + bleDevice.name + '...', 'info');
    bleServer = await bleDevice.gatt.connect();

    var service = await bleServer.getPrimaryService(SERVICE_UUID);

    // Caracteristica STATUS (citire + notify)
    charStatus = await service.getCharacteristic(STATUS_UUID);
    await charStatus.startNotifications();
    charStatus.addEventListener('characteristicvaluechanged', onStatusChanged);

    // Citire status initial
    var val = await charStatus.readValue();
    var status = new TextDecoder().decode(val);
    proceseazaStatus(status);

    // Caracteristica COMANDA (scriere)
    charComanda = await service.getCharacteristic(COMANDA_UUID);

    // UI conectat
    elDot.className = 'dot connected';
    elTxt.textContent = 'conectat';
    btnBLE.textContent = 'DECONECTEAZĂ';
    btnBLE.disabled = false;
    btnBLE.onclick = deconecteazaBLE;
    addLog('✓ BLE conectat!', 'ok');
    updateUI();

  } catch (err) {
    addLog('Eroare: ' + err.message, 'err');
    elDot.className = 'dot disconnected';
    elTxt.textContent = 'eroare';
    btnBLE.disabled = false;
  }
}

// ── DECONECTARE ──
function deconecteazaBLE() {
  if (bleDevice && bleDevice.gatt.connected) {
    bleDevice.gatt.disconnect();
  }
}

function onDisconnected() {
  charComanda = null;
  charStatus  = null;
  cmdPending  = false;
  elDot.className = 'dot disconnected';
  elTxt.textContent = 'deconectat';
  btnBLE.textContent = 'CONECTEAZĂ';
  btnBLE.onclick = conecteazaBLE;
  btnBLE.disabled = false;
  afiseaza('OFFLINE');
  btnUp.disabled = btnDown.disabled = true;
  addLog('BLE deconectat', 'warn');
}

// ── STATUS PRIMIT DE LA ESP32 ──
function onStatusChanged(event) {
  var val = new TextDecoder().decode(event.target.value);
  proceseazaStatus(val);
}

function proceseazaStatus(status) {
  status = status.trim();
  addLog('← ' + status, 'info');

  if (status === 'RIDICAT' || status === 'COBORAT') {
    pozitie    = status;
    masina     = 'NU';
    cmdPending = false;
    if (progTimer) {
      clearInterval(progTimer); progTimer = null;
      elPWrap.style.display = 'none';
      elPBar.style.width = '0%';
      elTimer.textContent = '';
    }
    updateUI();
  } else if (status === 'SE_RIDICA' || status === 'SE_COBOARA') {
    afiseaza(status);
  } else if (status === 'BLOCAT_MASINA') {
    masina     = 'DA';
    cmdPending = false;
    updateUI();
  }
}

// ── TRIMITE COMANDA ──
async function sendCmd(cmd) {
  if (cmdPending || !charComanda) return;
  cmdPending = true;
  btnUp.disabled = btnDown.disabled = true;

  var stareInter = (cmd === 'RIDICA') ? 'SE_RIDICA' : 'SE_COBOARA';
  afiseaza(stareInter);
  elMRow.style.display = 'none';
  startProgres(1500);

  try {
    var encoder = new TextEncoder();
    await charComanda.writeValue(encoder.encode(cmd));
    addLog('▶ ' + cmd, 'ok');
  } catch (err) {
    addLog('Eroare trimitere: ' + err.message, 'err');
    cmdPending = false;
    updateUI();
  }
}

// ── BUTOANE ──
btnUp.addEventListener('click', function(e) {
  e.preventDefault();
  sendCmd('RIDICA');
});
btnDown.addEventListener('click', function(e) {
  e.preventDefault();
  sendCmd('COBOARA');
});
</script>
</body>
</html>
