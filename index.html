<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TireaPark · PROBA-1</title>
<meta name="application-name" content="TireaPark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TireaPark">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d1117'/><rect x='42' y='15' width='16' height='45' rx='8' fill='%2300e64d'/><rect x='28' y='68' width='44' height='14' rx='7' fill='%2300e64d'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d1117'/><rect x='42' y='15' width='16' height='45' rx='8' fill='%2300e64d'/><rect x='28' y='68' width='44' height='14' rx='7' fill='%2300e64d'/></svg>">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:  #00e64d;
  --red:    #ff3c3c;
  --yellow: #facc15;
  --blue:   #38bdf8;
  --bg:     #080b10;
  --card:   #0e1318;
  --border: #1c2330;
  --text:   #c9d1d9;
  --dim:    #3d4a5a;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'Space Mono', monospace;
  color: var(--text);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  min-height: 100dvh;
  background-image:
    linear-gradient(rgba(0,230,77,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,230,77,0.03) 1px, transparent 1px);
  background-size: 32px 32px;
}

.card {
  width: 100%;
  max-width: 360px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px 20px 20px;
  box-shadow: 0 0 60px rgba(0,230,77,0.06), 0 20px 40px rgba(0,0,0,0.6);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.logo { display: flex; align-items: center; gap: 10px; }

.logo-icon {
  width: 36px; height: 36px;
  background: #0a1a0f;
  border: 1px solid var(--green);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.logo-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: #fff;
  line-height: 1;
}

.logo-sub { font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-top: 1px; }

.fb-dot-wrap {
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; color: var(--dim); letter-spacing: 0.5px;
}

.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim); transition: background 0.3s;
  box-shadow: 0 0 6px currentColor;
}
.dot.on  { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.off { background: var(--red);   box-shadow: 0 0 8px var(--red); }

.status-box {
  background: #060a0e;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 16px 14px;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}

.status-box.RIDICAT    { border-color: rgba(0,230,77,0.4); }
.status-box.COBORAT    { border-color: rgba(255,60,60,0.4); }
.status-box.SE_RIDICA,
.status-box.SE_COBOARA { border-color: rgba(250,204,21,0.4); }
.status-box.MASINA     { border-color: rgba(56,189,248,0.4); }

.status-label {
  font-size: 9px; letter-spacing: 2px;
  color: var(--dim); margin-bottom: 10px; text-transform: uppercase;
}

.status-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px; letter-spacing: 3px; line-height: 1;
  color: var(--dim); transition: color 0.25s, text-shadow 0.25s;
}

.status-val.RIDICAT    { color: var(--green);  text-shadow: 0 0 20px rgba(0,230,77,0.5); }
.status-val.COBORAT    { color: var(--red);    text-shadow: 0 0 20px rgba(255,60,60,0.5); }
.status-val.SE_RIDICA,
.status-val.SE_COBOARA { color: var(--yellow); text-shadow: 0 0 20px rgba(250,204,21,0.5); }
.status-val.MASINA     { color: var(--blue);   text-shadow: 0 0 20px rgba(56,189,248,0.5); }
.status-val.OFFLINE    { color: var(--dim); }

.masina-row { margin-top: 8px; font-size: 10px; color: var(--dim); letter-spacing: 1px; }
.masina-row .da { color: var(--blue); font-weight: bold; }

.progress-wrap {
  height: 3px; background: var(--border);
  border-radius: 2px; margin-top: 12px; overflow: hidden;
  display: none;
}
.progress-bar {
  height: 100%; width: 0%;
  background: var(--yellow); border-radius: 2px;
  box-shadow: 0 0 8px var(--yellow);
}
.timer-txt {
  font-size: 10px; color: var(--yellow);
  margin-top: 6px; min-height: 14px; letter-spacing: 0.5px;
}

.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

.btn {
  border: none; border-radius: 12px; padding: 18px 10px;
  font-family: 'Bebas Neue', sans-serif; font-size: 18px;
  letter-spacing: 2px; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; position: relative; overflow: hidden;
}
.btn .btn-icon { font-size: 22px; }
.btn .btn-lbl  { font-size: 14px; letter-spacing: 1px; }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:disabled {
  background: #0e1318 !important;
  color: #1e2a35 !important;
  border-color: #1c2330 !important;
  box-shadow: none !important;
  cursor: not-allowed;
  pointer-events: none;
}

.btn-up {
  background: linear-gradient(135deg, #003d1a, #005c28);
  color: var(--green); border: 1px solid rgba(0,230,77,0.3);
  box-shadow: 0 4px 20px rgba(0,230,77,0.15);
}
.btn-down {
  background: linear-gradient(135deg, #3d0000, #5c0000);
  color: var(--red); border: 1px solid rgba(255,60,60,0.3);
  box-shadow: 0 4px 20px rgba(255,60,60,0.15);
}

.btn::after {
  content: ''; position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.15); width: 0; height: 0;
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  transition: width 0.3s, height 0.3s, opacity 0.3s; opacity: 0;
}
.btn:active::after { width: 200px; height: 200px; opacity: 1; transition: 0s; }

.log-header { font-size: 9px; color: var(--dim); letter-spacing: 2px; margin-bottom: 6px; text-transform: uppercase; }

.log {
  background: #060a0e; border: 1px solid var(--border);
  border-radius: 10px; padding: 10px; height: 120px;
  overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.log::-webkit-scrollbar { width: 3px; }
.log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.log-line { font-size: 9px; padding: 2px 0; border-bottom: 1px solid #0e1318; color: var(--dim); }
.log-line.ok   { color: var(--green); }
.log-line.err  { color: var(--red); }
.log-line.info { color: var(--blue); }
.log-line.warn { color: var(--yellow); }

#install-banner {
  display: none;
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #0e1318; border: 1px solid var(--green);
  border-radius: 14px; padding: 14px 18px;
  width: calc(100% - 32px); max-width: 360px;
  box-shadow: 0 0 30px rgba(0,230,77,0.2);
  z-index: 999; animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateX(-50%) translateY(30px); opacity: 0; }
  to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
}
#install-banner .banner-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: #fff; letter-spacing: 1px; margin-bottom: 4px; }
#install-banner .banner-sub   { font-size: 10px; color: var(--dim); margin-bottom: 12px; }
#install-banner .banner-btns  { display: flex; gap: 8px; }
#install-banner .btn-install  { flex: 1; padding: 10px; background: var(--green); color: #000; border: none; border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; cursor: pointer; }
#install-banner .btn-dismiss  { padding: 10px 14px; background: transparent; color: var(--dim); border: 1px solid var(--border); border-radius: 8px; font-size: 11px; cursor: pointer; font-family: 'Space Mono', monospace; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🅿</div>
      <div>
        <div class="logo-text">TireaPark</div>
        <div class="logo-sub">BLOCATOR · PROBA-1</div>
      </div>
    </div>
    <div class="fb-dot-wrap">
      <div class="dot" id="fb-dot"></div>
      <span id="fb-txt">—</span>
    </div>
  </div>

  <div class="status-box OFFLINE" id="status-box">
    <div class="status-label">STATUS BLOCATOR</div>
    <div class="status-val OFFLINE" id="status-val">OFFLINE</div>
    <div class="masina-row" id="masina-row" style="display:none">
      🚗 Mașină detectată: <span id="masina-val" class="da">DA</span>
    </div>
    <div class="progress-wrap" id="prog-wrap">
      <div class="progress-bar" id="prog-bar"></div>
    </div>
    <div class="timer-txt" id="timer-txt"></div>
  </div>

  <div class="buttons">
    <button class="btn btn-up"   id="btn-up"   onclick="sendCmd('RIDICA')"  disabled>
      <span class="btn-icon">▲</span>
      <span class="btn-lbl">RIDICĂ</span>
    </button>
    <button class="btn btn-down" id="btn-down" onclick="sendCmd('COBOARA')" disabled>
      <span class="btn-icon">▼</span>
      <span class="btn-lbl">COBOARĂ</span>
    </button>
  </div>

  <div class="log-header">▸ LOG EVENIMENTE</div>
  <div class="log" id="log">
    <div class="log-line info">── sistem pornit ──</div>
  </div>
</div>

<div id="install-banner">
  <div class="banner-title">📲 Instalează TireaPark</div>
  <div class="banner-sub">Adaugă pe ecranul principal</div>
  <div class="banner-btns">
    <button class="btn-install" onclick="installApp()">INSTALEAZĂ</button>
    <button class="btn-dismiss" onclick="dismissInstall()">Mai târziu</button>
  </div>
</div>

<script>
// ── PWA ──
(function() {
  var m = {name:"TireaPark",short_name:"TireaPark",start_url:".",display:"standalone",background_color:"#0d1117",theme_color:"#0d1117",orientation:"portrait",icons:[{src:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",sizes:"192x192",type:"image/png"}]};
  var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(l);
})();
if('serviceWorker'in navigator){
  var sw=`self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('activate',e=>{self.clients.claim()});self.addEventListener('fetch',e=>{if(e.request.url.includes('firebase')||e.request.url.includes('gstatic')||e.request.url.includes('googleapis'))return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'})),{scope:'/'});
}

// ── FIREBASE ──
firebase.initializeApp({
  apiKey:            'AIzaSyDF63PQ9s2AG9_8ho9u6v-myzDrs_SrtbY',
  authDomain:        'tireapark.firebaseapp.com',
  databaseURL:       'https://tireapark-default-rtdb.firebaseio.com',
  projectId:         'tireapark',
  storageBucket:     'tireapark.firebasestorage.app',
  messagingSenderId: '503087510644',
  appId:             '1:503087510644:web:18d5e122c67afe110e8d21'
});

var db  = firebase.database();
var ref = db.ref('blocatoare/PROBA-1');

// ── STARE GLOBALA ──
// pozitie = 'RIDICAT' | 'COBORAT'  → pozitia fizica a blocatorului
// masina  = 'DA' | 'NU'            → senzor masina
var pozitie  = 'COBORAT';
var masina   = 'NU';
var animRuns = false;  // true cat timp ruleaza animatia de 1.2s

// ── DOM ──
var elBox   = document.getElementById('status-box');
var elVal   = document.getElementById('status-val');
var elMRow  = document.getElementById('masina-row');
var elPWrap = document.getElementById('prog-wrap');
var elPBar  = document.getElementById('prog-bar');
var elTimer = document.getElementById('timer-txt');
var btnUp   = document.getElementById('btn-up');
var btnDown = document.getElementById('btn-down');

// ── LOG ──
function addLog(msg, tip) {
  var el = document.getElementById('log');
  var d  = document.createElement('div');
  d.className = 'log-line ' + (tip || '');
  var t = new Date();
  d.textContent = '[' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds()) + '] ' + msg;
  el.insertBefore(d, el.children[1] || null);
}
function pad(n) { return String(n).padStart(2, '0'); }

// ── AFISEAZA STARE VIZUALA ──
function afiseaza(stare) {
  elVal.textContent = stare.replace(/_/g, ' ');
  elVal.className   = 'status-val ' + stare;
  elBox.className   = 'status-box ' + stare;
}

// ── UPDATE BUTOANE + UI ──
// Aceasta functie este SINGURA care decide starea butoanelor si a UI-ului.
// Se apeleaza dupa orice schimbare de stare.
//
// Reguli clare:
//  1. Animatie in curs          → ambele OFF, UI = SE_RIDICA / SE_COBOARA (setat separat)
//  2. Masina = DA               → ambele OFF, UI = MASINA, arata randul masina
//  3. pozitie = RIDICAT, MA=NU → RIDICA OFF,  COBOARA ON,  UI = RIDICAT
//  4. pozitie = COBORAT, MA=NU → RIDICA ON,   COBOARA OFF, UI = COBORAT
function updateUI() {
  // Cazul 1: animatie in curs — nu schimbam nimic, sendCmd gestioneaza UI-ul
  if (animRuns) {
    btnUp.disabled = btnDown.disabled = true;
    return;
  }

  // Cazul 2: masina prezenta
  if (masina === 'DA') {
    btnUp.disabled   = true;
    btnDown.disabled = true;
    elMRow.style.display = 'block';
    afiseaza('MASINA');
    return;
  }

  // Cazul 3 & 4: fara masina
  elMRow.style.display = 'none';

  if (pozitie === 'RIDICAT') {
    btnUp.disabled   = true;   // deja sus, nu mai ridici
    btnDown.disabled = false;  // poti cobori
    afiseaza('RIDICAT');
  } else {
    btnUp.disabled   = false;  // poti ridica
    btnDown.disabled = true;   // deja jos
    afiseaza('COBORAT');
  }
}

// ── COMANDA ──
function sendCmd(cmd) {
  var stareInter = (cmd === 'RIDICA') ? 'SE_RIDICA'  : 'SE_COBOARA';
  var stareFinal = (cmd === 'RIDICA') ? 'RIDICAT'    : 'COBORAT';
  var eLiber     = (cmd === 'RIDICA');

  // blocheaza butoanele si arata starea intermediara
  animRuns = true;
  btnUp.disabled = btnDown.disabled = true;
  afiseaza(stareInter);
  elMRow.style.display = 'none';

  // scrie comanda in Firebase
  ref.update({ status: stareInter, comanda: cmd, comanda_timestamp: Date.now() });
  addLog('▶ ' + cmd, 'ok');

  // porneste timer 1.2s
  var DURATA  = 1200;
  var elapsed = 0;
  var STEP    = 50;

  elPWrap.style.display = 'block';
  elPBar.style.width    = '0%';

  var timer = setInterval(function() {
    elapsed += STEP;
    elPBar.style.width  = Math.min((elapsed / DURATA) * 100, 100) + '%';
    var ramas = ((DURATA - elapsed) / 1000).toFixed(1);
    elTimer.textContent = ramas > 0 ? 'Finalizare în ' + ramas + 's...' : '';

    if (elapsed >= DURATA) {
      clearInterval(timer);

      // ascunde progresul
      elPWrap.style.display = 'none';
      elPBar.style.width    = '0%';
      elTimer.textContent   = '';

      // actualizeaza starea locala
      pozitie  = stareFinal;
      animRuns = false;

      // scrie starea finala in Firebase
      ref.update({
        status:             stareFinal,
        comanda:            'NONE',
        free:               eLiber,
        ultima_actualizare: Date.now()
      });
      addLog('✓ ' + stareFinal, stareFinal === 'RIDICAT' ? 'ok' : 'err');

      // actualizeaza UI pe baza starii curente (pozitie + masina)
      updateUI();
    }
  }, STEP);
}

// ── FIREBASE: CONEXIUNE ──
db.ref('.info/connected').on('value', function(s) {
  var ok = s.val();
  document.getElementById('fb-dot').className = 'dot ' + (ok ? 'on' : 'off');
  document.getElementById('fb-txt').textContent = ok ? 'online' : 'offline';
  if (ok) addLog('Firebase conectat', 'info');
});

// ── FIREBASE: CITIRE INITIALA ──
ref.once('value', function(snap) {
  var d = snap.val();
  if (!d) {
    ref.set({
      id: 'PROBA-1', lat: 46.7712, lng: 23.5898,
      addr: 'TEST · Str. Probei 1', price: 5, hours: '08-18',
      free: true, status: 'COBORAT', comanda: 'NONE',
      masina_prezenta: 'NU', ultima_actualizare: Date.now()
    });
    pozitie = 'COBORAT';
    masina  = 'NU';
  } else {
    var s = d.status || 'COBORAT';
    pozitie = (s === 'RIDICAT') ? 'RIDICAT' : 'COBORAT';
    masina  = d.masina_prezenta || 'NU';
  }
  addLog('Init: ' + pozitie + ' | Masina: ' + masina, 'info');
  updateUI();
});

// ── FIREBASE: SENZOR MASINA (LIVE) ──
// Cand senzorul se schimba in Firebase, actualizam UI imediat
ref.child('masina_prezenta').on('value', function(s) {
  var val = s.val();
  if (!val) return;
  var vechi = masina;
  masina = val;
  if (masina !== vechi) {
    addLog('Senzor: ' + masina, masina === 'DA' ? 'warn' : 'info');
    if (!animRuns) updateUI();
  }
});

// ── PWA INSTALL ──
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(function() { document.getElementById('install-banner').style.display = 'block'; }, 2000);
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(r) {
    addLog(r.outcome === 'accepted' ? '✓ Instalat!' : 'Anulat', r.outcome === 'accepted' ? 'ok' : 'warn');
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  });
}
function dismissInstall() {
  document.getElementById('install-banner').style.display = 'none';
}
window.addEventListener('appinstalled', function() {
  addLog('✓ TireaPark instalat!', 'ok');
});
</script>
</body>
</html>
