<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:  #00e64d;
  --red:    #ff3c3c;
  --yellow: #facc15;
  --blue:   #38bdf8;
  --bg:     #080b10;
  --card:   #0e1318;
  --border: #1c2330;
  --text:   #c9d1d9;
  --dim:    #3d4a5a;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'Space Mono', monospace;
  color: var(--text);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  min-height: 100dvh;
  background-image:
    linear-gradient(rgba(0,230,77,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,230,77,0.03) 1px, transparent 1px);
  background-size: 32px 32px;
}

.card {
  width: 100%;
  max-width: 360px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px 20px 20px;
  box-shadow: 0 0 60px rgba(0,230,77,0.06), 0 20px 40px rgba(0,0,0,0.6);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.logo { display: flex; align-items: center; gap: 10px; }

.logo-icon {
  width: 36px; height: 36px;
  background: #0a1a0f;
  border: 1px solid var(--green);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.logo-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  color: #fff;
  line-height: 1;
}

.logo-sub { font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-top: 1px; }

.fb-dot-wrap {
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; color: var(--dim); letter-spacing: 0.5px;
}

.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim); transition: background 0.3s;
  box-shadow: 0 0 6px currentColor;
}
.dot.on  { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.off { background: var(--red);   box-shadow: 0 0 8px var(--red); }

.status-box {
  background: #060a0e;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 16px 14px;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}

.status-box.RIDICAT       { border-color: rgba(0,230,77,0.4); }
.status-box.COBORAT       { border-color: rgba(255,60,60,0.4); }
.status-box.SE_RIDICA,
.status-box.SE_COBOARA    { border-color: rgba(250,204,21,0.4); }
.status-box.BLOCAT_MASINA { border-color: rgba(56,189,248,0.4); }

.status-label {
  font-size: 9px; letter-spacing: 2px;
  color: var(--dim); margin-bottom: 10px; text-transform: uppercase;
}

.status-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px; letter-spacing: 3px; line-height: 1;
  color: var(--dim); transition: color 0.25s, text-shadow 0.25s;
}

.status-val.RIDICAT       { color: var(--green);  text-shadow: 0 0 20px rgba(0,230,77,0.5); }
.status-val.COBORAT       { color: var(--red);    text-shadow: 0 0 20px rgba(255,60,60,0.5); }
.status-val.SE_RIDICA,
.status-val.SE_COBOARA    { color: var(--yellow); text-shadow: 0 0 20px rgba(250,204,21,0.5); }
.status-val.BLOCAT_MASINA { color: var(--blue);   text-shadow: 0 0 20px rgba(56,189,248,0.5); }
.status-val.OFFLINE       { color: var(--dim); }

.masina-row { margin-top: 8px; font-size: 10px; color: var(--dim); letter-spacing: 1px; }
.masina-row span { font-weight: bold; }
.masina-row .da { color: var(--blue); }
.masina-row .nu { color: var(--green); }

.progress-wrap {
  height: 3px; background: var(--border);
  border-radius: 2px; margin-top: 12px; overflow: hidden;
}
.progress-bar {
  height: 100%; width: 0%;
  background: var(--yellow); border-radius: 2px;
  transition: width 0.05s linear; box-shadow: 0 0 8px var(--yellow);
}
.timer-txt {
  font-size: 10px; color: var(--yellow);
  margin-top: 6px; min-height: 14px; letter-spacing: 0.5px;
}

.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

.btn {
  border: none; border-radius: 12px; padding: 18px 10px;
  font-family: 'Bebas Neue', sans-serif; font-size: 18px;
  letter-spacing: 2px; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; position: relative; overflow: hidden;
}
.btn .btn-icon { font-size: 22px; }
.btn .btn-lbl  { font-size: 14px; letter-spacing: 1px; }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn:disabled {
  background: #0e1318 !important;
  color: #1e2a35 !important;
  border-color: #1c2330 !important;
  box-shadow: none !important;
  cursor: not-allowed;
  pointer-events: none;
}

.btn-up {
  background: linear-gradient(135deg, #003d1a, #005c28);
  color: var(--green); border: 1px solid rgba(0,230,77,0.3);
  box-shadow: 0 4px 20px rgba(0,230,77,0.15);
}
.btn-down {
  background: linear-gradient(135deg, #3d0000, #5c0000);
  color: var(--red); border: 1px solid rgba(255,60,60,0.3);
  box-shadow: 0 4px 20px rgba(255,60,60,0.15);
}

.btn::after {
  content: ''; position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.15); width: 0; height: 0;
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  transition: width 0.3s, height 0.3s, opacity 0.3s; opacity: 0;
}
.btn:active::after { width: 200px; height: 200px; opacity: 1; transition: 0s; }

.log-header { font-size: 9px; color: var(--dim); letter-spacing: 2px; margin-bottom: 6px; text-transform: uppercase; }

.log {
  background: #060a0e; border: 1px solid var(--border);
  border-radius: 10px; padding: 10px; height: 120px;
  overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.log::-webkit-scrollbar { width: 3px; }
.log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.log-line { font-size: 9px; padding: 2px 0; border-bottom: 1px solid #0e1318; color: var(--dim); }
.log-line.ok   { color: var(--green); }
.log-line.err  { color: var(--red); }
.log-line.info { color: var(--blue); }
.log-line.warn { color: var(--yellow); }

/* INSTALL BANNER */
#install-banner {
  display: none;
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #0e1318; border: 1px solid var(--green);
  border-radius: 14px; padding: 14px 18px;
  width: calc(100% - 32px); max-width: 360px;
  box-shadow: 0 0 30px rgba(0,230,77,0.2);
  z-index: 999; animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateX(-50%) translateY(30px); opacity: 0; }
  to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
}
#install-banner .banner-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: #fff; letter-spacing: 1px; margin-bottom: 4px; }
#install-banner .banner-sub   { font-size: 10px; color: var(--dim); margin-bottom: 12px; }
#install-banner .banner-btns  { display: flex; gap: 8px; }
#install-banner .btn-install  { flex: 1; padding: 10px; background: var(--green); color: #000; border: none; border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; cursor: pointer; }
#install-banner .btn-dismiss  { padding: 10px 14px; background: transparent; color: var(--dim); border: 1px solid var(--border); border-radius: 8px; font-size: 11px; cursor: pointer; font-family: 'Space Mono', monospace; }
</style>
</head>

  var swCode = `

  apiKey:            'AIzaSyDF63PQ9s2AG9_8ho9u6v-myzDrs_SrtbY',
  authDomain:        'tireapark.firebaseapp.com',

var db  = firebase.database();
var ref = db.ref('blocatoare/PROBA-1');

var stareReala  = 'COBORAT';
var stareFizica = 'COBORAT';
var timerAnim   = null;

var elBox     = document.getElementById('status-box');
var elVal     = document.getElementById('status-val');
var elTimer   = document.getElementById('timer-txt');
var elProg    = document.getElementById('prog-bar');
var elProgW   = document.getElementById('prog-wrap');
var elMasina  = document.getElementById('masina-row');
var elMasinaV = document.getElementById('masina-val');
var btnUp     = document.getElementById('btn-up');
var btnDown   = document.getElementById('btn-down');

function log(msg, type) {
  var el = document.getElementById('log');
  var d  = document.createElement('div');
  d.className = 'log-line ' + (type || '');
  var t  = new Date();
  var ts = pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds());
  d.textContent = '['+ts+'] '+msg;
  el.insertBefore(d, el.children[1] || null);
}
function pad(n){ return String(n).padStart(2,'0'); }

db.ref('.info/connected').on('value', function(s) {
  var ok  = s.val();
  document.getElementById('fb-dot').className = 'dot ' + (ok ? 'on' : 'off');
  document.getElementById('fb-txt').textContent = ok ? 'online' : 'offline';
  if (ok) log('Firebase conectat', 'info');
});

ref.once('value', function(snap) {
  var data = snap.val();
  if (!data) {
    ref.set({ id:'PROBA-1', lat:46.7712, lng:23.5898, addr:'TEST · Str. Probei 1', price:5, hours:'08-18', free:true, status:'COBORAT', comanda:'NONE', masina_prezenta:'NU', ultima_actualizare:Date.now() });
    stareReala  = 'COBORAT';
    stareFizica = 'COBORAT';
  } else {
    var s = data.status || 'COBORAT';
    if (s === 'SE_RIDICA' || s === 'SE_COBOARA') s = 'COBORAT';
    stareReala  = s;
    stareFizica = (s === 'RIDICAT') ? 'RIDICAT' : 'COBORAT';
    if (data.masina_prezenta) updateMasina(data.masina_prezenta);
  }
  afiseazaStare(stareReala);
  activeazaButoane();
  log('Stare: ' + stareReala, 'info');
});

ref.child('status').on('value', function(s) {
  var val = s.val();
  if (!val) return;
  if (val === 'RIDICAT' || val === 'COBORAT') stareFizica = val;
  if (!timerAnim) {
    afiseazaStare(val);
    stareReala = val;
    activeazaButoane();
  }
});

ref.child('masina_prezenta').on('value', function(s) {
  var val = s.val();
  if (val) {
    updateMasina(val);
    // Recalculeaza butoanele live cand se schimba senzorul
    if (!timerAnim) activeazaButoane();
  }
});

function afiseazaStare(s) {
  elVal.textContent = s.replace(/_/g, ' ');
  elVal.className   = 'status-val ' + s;
  elBox.className   = 'status-box ' + s;
}

function updateMasina(val) {
  elMasina.style.display = 'block';
  elMasinaV.textContent  = val;
  elMasinaV.className    = (val === 'DA') ? 'da' : 'nu';
}

// ═══════════════════════════════════════════════
//  LOGICA BUTOANE
//  - Daca masina prezenta = DA → ambele blocate
//  - Daca masina pleaca (NU)   → INTOTDEAUNA aprinde RIDICA
//  - BLOCAT_MASINA             → ambele blocate
// ═══════════════════════════════════════════════
function activeazaButoane() {
  var masinaE = (elMasinaV.textContent === 'DA');

  if (stareReala === 'BLOCAT_MASINA' || masinaE) {
    btnUp.disabled   = true;
    btnDown.disabled = true;
    return;
  }

  // Dupa ce masina pleaca, intotdeauna aprinde RIDICA
  btnUp.disabled   = false;
  btnDown.disabled = true;
}

function sendCmd(cmd) {
  if (timerAnim) { clearInterval(timerAnim); timerAnim = null; }

  var intermediar = (cmd === 'RIDICA') ? 'SE_RIDICA'  : 'SE_COBOARA';
  var finalStare  = (cmd === 'RIDICA') ? 'RIDICAT'    : 'COBORAT';
  var isFree      = (cmd === 'RIDICA');

  btnUp.disabled = btnDown.disabled = true;
  afiseazaStare(intermediar);

  ref.update({ status: intermediar, comanda: cmd, comanda_timestamp: Date.now() });
  log('▶ Comanda: ' + cmd, 'ok');

  // ── TIMER 1.3 secunde ──
  var total   = 1200;
  var elapsed = 0;
  var step    = 50;

  elProgW.style.display = 'block';
  elProg.style.width    = '0%';

  timerAnim = setInterval(function() {
    elapsed += step;
    elProg.style.width = Math.min((elapsed / total) * 100, 100) + '%';
    elTimer.textContent = 'Finalizare în ' + ((total - elapsed) / 1000).toFixed(1) + 's...';

    if (elapsed >= total) {
      clearInterval(timerAnim); timerAnim = null;
      elProgW.style.display = 'none';
      elProg.style.width    = '0%';
      elTimer.textContent   = '';

      stareReala  = finalStare;
      stareFizica = finalStare;
      afiseazaStare(finalStare);

      ref.update({ status: finalStare, comanda: 'NONE', free: isFree, ultima_actualizare: Date.now() });
      log('✓ ' + finalStare, finalStare === 'RIDICAT' ? 'ok' : 'err');

      // Citeste starea reala din Firebase (inclusiv masina_prezenta) inainte de a activa butoane
      ref.once('value', function(snap) {
        var data = snap.val() || {};
        if (data.masina_prezenta) updateMasina(data.masina_prezenta);
        activeazaButoane();
      });
    }
  }, step);
}

var deferredPrompt = null;

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(function() {
    document.getElementById('install-banner').style.display = 'block';
    log('📲 Apasa INSTALEAZA pentru iconita', 'info');
  }, 2000);
});

function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(r) {
    log(r.outcome === 'accepted' ? '✓ Instalat!' : 'Anulat', r.outcome === 'accepted' ? 'ok' : 'warn');
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  });
}

function dismissInstall() {
  document.getElementById('install-banner').style.display = 'none';
}

window.addEventListener('appinstalled', function() {
  log('✓ TireaPark pe ecran principal!', 'ok');
});
</script>
</body>
</html>
